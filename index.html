<style>
:root{--bg:#0e1424;--sf:#151d33;--tx:#e9eefb;--mu:#8f9bb8;--pr:#22d3ee;--pr2:#1c2a4a;--bd:#27355a;--ok:#34d399;--er:#f87171;--g:linear-gradient(90deg,#22d3ee,#a78bfa);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,#2b1f5a66,transparent),radial-gradient(700px 500px at 0 100%,#0b5c7a45,transparent),var(--bg)}
#app{display:flex;min-height:100vh}
nav{width:250px;padding:16px 12px;background:#0a1020d9;border-right:1px solid var(--bd);flex-shrink:0;overflow:auto}
.brand{text-align:center;margin:4px 0 14px}.brand b{display:block;font-size:21px;letter-spacing:1px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.brand span{font-size:11px;color:var(--mu)}
nav small{display:block;text-align:center;margin:0 0 12px;color:var(--mu)}
nav a,.fc{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:12px;color:var(--tx);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),transparent);transition:.15s}
nav a{cursor:pointer}
nav a i,.fc i{font-style:normal;flex:0 0 32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--c);font-size:16px;box-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
nav a:hover,nav a.on{box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),transparent)}
main{flex:1;min-width:0;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
h2{margin:0;font-size:22px}h3{margin:0 0 8px;font-size:15px}
.card{background:linear-gradient(180deg,#18223d,#131b31);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0004}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.grid .card:nth-child(4n+1){--c:#34d399}.grid .card:nth-child(4n+2){--c:#60a5fa}.grid .card:nth-child(4n+3){--c:#a78bfa}.grid .card:nth-child(4n){--c:#facc15}
.st{border-top:2px solid var(--c)}.st b{display:block;font-size:26px;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}.st span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}td.w{white-space:normal;min-width:160px}tr:hover td{background:#ffffff08}
.b{background:var(--g);color:#06101f;font-weight:600;border:0;border-radius:10px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600;box-shadow:0 0 14px #22d3ee40}.b:disabled{opacity:.5}
.b.g{background:var(--pr2);color:var(--pr);border:1px solid var(--bd);box-shadow:none}.b.d{background:none;color:var(--er);padding:2px 6px;box-shadow:none}.b.s{padding:3px 9px;font-size:12px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:#0b1224;color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px #22d3ee22}textarea{min-height:70px}
label{display:block;margin-bottom:9px;color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.row>*{flex:1;min-width:120px}.row .b{flex:0 0 auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--pr2);color:var(--pr);font-size:12px}.tag.ok{background:#064e3b;color:#6ee7b7}.tag.er{background:#4c1d1d;color:#fca5a5}
code{background:#0b1224;padding:1px 6px;border-radius:6px;color:#a5f3fc}.mu{color:var(--mu)}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.mb{background:#131b31;border:1px solid var(--bd);box-shadow:0 0 40px #22d3ee22;border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.rl button{padding:12px;border:1px solid var(--bd);background:#0b1224;color:var(--tx);border-radius:12px;cursor:pointer;font:inherit}.rl button.on{border-color:var(--pr);box-shadow:0 0 14px #22d3ee40}
.chat{height:300px;overflow:auto;background:#0b1224;border-radius:10px;padding:8px;margin-bottom:8px}.msg{margin-bottom:6px}.msg b{color:var(--pr)}
.lg{display:grid;grid-template-columns:1fr 1fr;width:100%;min-height:100vh}.lgl{padding:36px 44px;display:flex;flex-direction:column;justify-content:center;background:#0a1020aa}.brand svg{display:block;margin:0 auto 4px;max-width:100%;height:auto}.lgl .brand{margin-bottom:22px}.lgl .brand b{font-size:40px}.lgl .brand span{font-size:13px}
.lgr{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle,#22d3ee55 1px,transparent 1.6px) 0 0/34px 34px,radial-gradient(500px 400px at 60% 50%,#a78bfa22,transparent)}
.lc{width:min(400px,100%);padding:26px;border-radius:18px;background:#0f1730f2;border:1.5px solid var(--pr);box-shadow:0 0 30px #22d3ee45,0 0 70px #a78bfa30,inset 0 0 24px #a78bfa18}
.lc h1{margin:0;text-align:center;font-size:24px}.lc>p{text-align:center;margin:2px 0 16px}#em{border-color:#22d3ee}#pw{border-color:#a78bfa}
@media(max-width:860px){.lg{grid-template-columns:1fr}.lgl{display:none}#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:6px;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}.brand,nav small{display:none}nav a{white-space:nowrap;margin:0;flex:0 0 auto}}
@media print{body{background:#fff;color:#000}nav,header .b,.np{display:none!important}.card{background:#fff;border-color:#ccc;box-shadow:none}th,td{color:#000}.st b{color:#000;text-shadow:none}.tag{background:#eee;color:#000}}
.hero{border-color:var(--pr);box-shadow:0 0 24px #22d3ee33}.hr{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}.hr h2{font-size:20px}.kp{text-align:right}.kp b{display:block;font-size:16px}
#pr{display:none}#pr table{border-collapse:collapse;width:100%}#pr th,#pr td{border:1px solid #000;padding:4px 6px;color:#000;white-space:normal;font-size:11pt;text-transform:none}#pr th{background:#eee;font-size:11pt}
.kop{text-align:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:14px}.kop b{display:block;font-size:16pt;text-transform:uppercase}
.sig{display:flex;justify-content:space-between;gap:20px;margin-top:34px;page-break-inside:avoid}.sc{width:46%;text-align:center}.sp{height:72px}
@media print{@page{margin:16mm}body{background:#fff!important}body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;font:12pt/1.45 "Times New Roman",serif}}

body{background:radial-gradient(900px 520px at 85% -10%,#1b2a6b40,transparent),radial-gradient(700px 500px at 0 100%,#07485f33,transparent),#070d1c}
main{padding:18px 22px}
.card{background:linear-gradient(180deg,#0e1932,#0b1429);border:1px solid #1d3a7a99;box-shadow:0 0 20px #1d4ed81f}
nav{width:216px;padding:16px 12px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;background:#080f20;border-right:1px solid #14213f}
.brand2{display:grid;place-items:center;margin:2px 0 16px}.brand2 svg{filter:drop-shadow(0 0 10px #22d3ee88)}
nav a{position:relative;display:flex;align-items:center;gap:11px;padding:7px 12px;margin:0;border:0;border-radius:10px;background:none;color:#e5ecfa;font-size:14px;cursor:pointer;box-shadow:none}
nav a i{flex:0 0 22px;width:22px;height:22px;background:none;box-shadow:none;border-radius:0;font-size:17px;display:grid;place-items:center}
nav a i svg{width:20px;height:20px;display:block}
nav a:hover{background:#ffffff0f;box-shadow:none}
nav a.on{background:linear-gradient(90deg,#1d6bff,#3b8cff);color:#fff;box-shadow:0 0 18px #3b82f680}
nav a.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:3px;background:#3b82f6;box-shadow:0 0 10px #3b82f6}
nav a.out{margin-top:auto;background:linear-gradient(90deg,#ff1744,#ff2d55);color:#fff;box-shadow:0 0 18px #ff174466;font-weight:600}
header.top{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:start;margin-bottom:14px}
.tt h1{margin:0;font-size:26px;line-height:1.2;color:#fff;text-shadow:0 0 18px #22d3ee88}
.tt p{margin:3px 0 0;color:#cbd5e1;font-size:14px}
.tr{display:flex;align-items:center;gap:12px;justify-self:end}
.who{text-align:right;font-size:12px;color:#cbd5e1;line-height:1.3}.who b{display:block;font-size:14px;color:#fff}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid #27355a;background:#0d1730;display:grid;place-items:center;cursor:pointer;padding:0;color:#e2e8f0}
.bell svg{width:19px;height:19px}
.bell em{position:absolute;top:-6px;right:-7px;background:#ef4444;color:#fff;font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 4px;border-radius:99px;display:grid;place-items:center;box-shadow:0 0 10px #ef444499}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b82f6,#a78bfa);border:2px solid #dbeafe55;flex:0 0 40px}
.ctl{grid-column:1/-1;justify-self:end;display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:flex-end}
.clk{font-size:12.5px;color:#cbd5e1}.ctl select{width:auto;padding:4px 8px;font-size:12px;border-radius:8px}
.bn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #2563eb;border-radius:14px;padding:12px 18px;margin-bottom:14px;background:linear-gradient(90deg,#0c1b3d,#0a1226);box-shadow:0 0 18px #2563eb44,inset 0 0 18px #2563eb14}
.bn h3{margin:0;font-size:16px}.bn p{margin:3px 0 0;color:#a9b6d3;font-size:13px}.bn .kp span{display:block}.bn .kp{font-size:12px;line-height:1.35}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stc{position:relative;overflow:hidden;border-radius:16px;padding:14px 16px;min-height:150px;color:#fff;border:1px solid #ffffff26}
.stc.o{background:linear-gradient(160deg,#ffa43a,#f97316 55%,#ea680c);box-shadow:0 0 24px #f9731666}
.stc.pu{background:linear-gradient(160deg,#a066fa,#7c3aed 55%,#6d28d9);box-shadow:0 0 24px #8b5cf666}
.stc.gr{background:linear-gradient(160deg,#27df90,#10b981 55%,#059669);box-shadow:0 0 24px #10b98166}
.stc.tl{background:linear-gradient(160deg,#0f4f60,#0b3a4c);border-color:#22d3ee;box-shadow:0 0 24px #22d3ee55}
.sh{display:flex;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:14px}
.si{width:30px;height:30px;border-radius:9px;background:#0003;display:grid;place-items:center;font-style:normal}.si svg{width:18px;height:18px}
.sv{display:flex;align-items:center;gap:8px;margin-top:6px;position:relative;z-index:1}.sv b{font-size:30px;line-height:1.1}.sv em{font-style:normal;font-size:11px;background:#0003;border-radius:99px;padding:2px 9px}
.spk{position:absolute;left:0;right:0;bottom:0;width:100%;height:62px}
.gg{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:50%}
.bg{display:grid;grid-template-columns:1.9fr 1.1fr 1fr;gap:14px;align-items:stretch}
.rc{display:flex;flex-direction:column;gap:14px}
.cd{border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,#0c1731,#0a1226);border:1px solid #1e2c52}
.cd.bl{border-color:#2563eb;box-shadow:0 0 20px #2563eb44}.cd.gn{border-color:#10b981;box-shadow:0 0 20px #10b98144}
.cd h4{margin:0 0 8px;font-size:15px}.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#cbd5e1;margin-bottom:6px}.lgd i,.lr i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.lr{display:flex;justify-content:space-between;font-size:13px;margin:6px 4px 0;color:#e2e8f0}
.ji{border-left:3px solid var(--c);padding:3px 0 3px 10px;margin:9px 0}.ji b{display:block;font-size:13px}.ji span{font-size:12px;color:#8f9bb8}
.pi{margin:9px 0;font-size:12.5px}.pi b{display:block}.pi span{color:#8f9bb8}
.lk{background:none;border:0;color:var(--pr);cursor:pointer;font:inherit;font-size:12px;padding:0;margin-top:4px}
@media(max-width:1180px){.bg{grid-template-columns:1fr 1fr}.rc{grid-column:1/-1;flex-direction:row}.rc>*{flex:1}}
@media(max-width:860px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px;gap:6px}.brand2{display:none}nav a{flex:0 0 auto;white-space:nowrap;padding:8px 12px}nav a.on::before{display:none}nav a.out{margin-top:0}main{padding:14px}.sg{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.bg{grid-template-columns:1fr}.rc{flex-direction:column}header.top{grid-template-columns:1fr}.tr,.ctl{justify-self:start;grid-column:1;justify-content:flex-start}.tt h1{font-size:20px}}
@media(max-width:430px){.sg{grid-template-columns:1fr}}
nav{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1d2b4f transparent}
.ng{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f7fa6;padding:12px 12px 4px;font-weight:600}
@media(max-width:860px){.ng{display:none}}
nav a.cb .chv{margin-left:auto;font-style:normal;opacity:.55;font-size:18px;line-height:1}
nav a.cb.open:not(.on){background:#ffffff14}
#cp{display:none;position:fixed;z-index:45;min-width:220px;padding:8px;border-radius:14px;background:#0b1429;border:1px solid #2563eb;box-shadow:0 12px 40px #000b,0 0 22px #2563eb55}
.cph{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6f7fa6;padding:6px 10px;font-weight:600}
#cp a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:#e5ecfa;font-size:14px;cursor:pointer;white-space:nowrap}
#cp a i{flex:0 0 22px;width:22px;height:22px;display:grid;place-items:center;font-style:normal;font-size:17px}#cp a i svg{width:20px;height:20px;display:block}
#cp a:hover{background:#ffffff0f}#cp a.on{background:linear-gradient(90deg,#1d6bff,#3b8cff);color:#fff;box-shadow:0 0 14px #3b82f680}
.gmg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gmc{display:flex;flex-direction:column;gap:8px;border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,#0c1731,#0a1226);border:1px solid #3b2f6d;box-shadow:0 0 18px #a78bfa22}
.gmc .row{margin-top:auto;align-items:center}.gmb{display:flex;flex-wrap:wrap;gap:6px}
.gmb i{font-style:normal;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid #3b4d7d;color:#cbd5e1}.gmb i:nth-child(1){border-color:#22c55e99}.gmb i:nth-child(2){border-color:#f59e0b99}.gmb i:nth-child(3){border-color:#a78bfa99}
.gmp{text-decoration:none;display:inline-block}
.gmc .row{flex-wrap:nowrap;gap:8px}.gmc .row>*{flex:0 0 auto}.gmc .row .b{padding:7px 14px;white-space:nowrap}
nav a span{white-space:nowrap}
@media print{.np{display:none!important}}


.hm{width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:28px 16px;background:radial-gradient(700px 420px at 12% 100%,#0d9e8a40,transparent),radial-gradient(700px 420px at 92% 100%,#a21caf45,transparent),radial-gradient(800px 400px at 50% 0,#0e7490333,transparent)}
.hmh{width:min(var(--hw,900px),100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.hmh .bl{display:flex;align-items:center}.hl{height:clamp(96px,14vw,150px);width:auto;filter:drop-shadow(0 0 12px #22d3ee55)}
.hmh h1{margin:0;font-size:clamp(19px,2.6vw,30px);text-align:center;color:#a5f3fc;text-shadow:0 0 18px #22d3ee99}.hmh p{margin:2px 0 0;text-align:center;color:var(--mu);font-size:13px}
.hg{width:min(var(--hw,900px),100%);display:grid;grid-template-columns:1fr 1fr;gap:24px}
.hc{--c:#22d3ee;position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:150px;padding:20px 22px;text-align:left;font:inherit;color:#fff;cursor:pointer;border-radius:18px;border:2px solid var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,#0b1226),#0b122699);box-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 22px color-mix(in srgb,var(--c) 22%,transparent);transition:.18s}
.hc:hover,.hc:focus-visible{transform:translateY(-3px) scale(1.015);outline:0;box-shadow:0 0 30px var(--c),inset 0 0 26px color-mix(in srgb,var(--c) 32%,transparent)}
.hc h3{margin:0 0 8px;font-size:21px;line-height:1.2;color:#fff}.hc p{margin:0;color:#cbd5e1;font-size:13.5px;max-width:230px}
.hc svg{flex:0 0 84px;width:84px;height:84px;color:var(--c);filter:drop-shadow(0 0 7px var(--c))}
.hp{width:min(560px,100%);text-align:center;--c:#22d3ee;padding:34px 26px;border-radius:20px;border:2px solid var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,#0b1226),#0b1226cc);box-shadow:0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}.hp svg{width:96px;height:96px;color:var(--c);filter:drop-shadow(0 0 8px var(--c))}.hp h2{margin:10px 0 6px}
@media(min-width:1500px){.hm{--hw:1100px}.hc{min-height:180px;padding:26px 28px}.hc h3{font-size:25px}.hc p{font-size:15px;max-width:280px}.hc svg{flex-basis:100px;width:100px;height:100px}}

@media(max-width:1000px) and (min-width:701px){.hg{gap:16px}.hc{padding:16px 18px}.hc svg{flex-basis:68px;width:68px;height:68px}.hc h3{font-size:18px}}

/* ===== Submenu terbuka ke bawah + footer pengembang ===== */
nav a.cb .chv{transition:transform .2s}nav a.cb.open .chv{transform:rotate(90deg);opacity:.9}
nav .sub{display:flex;flex-direction:column;gap:2px;margin:0 0 6px 18px;padding:2px 0 2px 8px;border-left:1px solid #1d3a7a;animation:subIn .18s ease-out}
nav .sub a{padding:6px 10px;font-size:13.5px;margin:0}nav .sub a.on::before{display:none}
@keyframes subIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
:root{--dh:26px}
body{padding-bottom:var(--dh)}
#app,.lg{min-height:calc(100vh - var(--dh))}.hm{min-height:calc(100vh - var(--dh));min-height:calc(100dvh - var(--dh))}
@media(min-width:861px){nav{height:calc(100vh - var(--dh));height:calc(100dvh - var(--dh))}}
#dev{position:fixed;left:0;right:0;bottom:0;z-index:10;text-align:center;font-size:11.5px;line-height:1.4;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));color:#8f9bb8;background:#070d1cf2;border-top:1px solid #14213f;pointer-events:none}
#dev b{color:#cbd5e1;font-weight:600}

/* ===== Loading progres ===== */
#ld{position:fixed;inset:0 0 var(--dh) 0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:#050a16ee;backdrop-filter:blur(4px)}
.ldc{--c:#22d3ee;width:min(380px,100%);text-align:center;padding:28px 24px;border-radius:20px;border:2px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,#0b1226),#0b1226);box-shadow:0 0 34px color-mix(in srgb,var(--c) 55%,transparent)}
.ldi{color:var(--c)}.ldi svg{width:72px;height:72px;filter:drop-shadow(0 0 8px var(--c))}
.ldsp{width:46px;height:46px;margin:0 auto 4px;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--c);animation:ldspin .8s linear infinite}
.ldc h3{margin:10px 0 2px;font-size:18px;color:#fff}.ldc p{margin:0 0 14px;color:#cbd5e1;font-size:13px;min-height:18px}
.ldb{height:10px;border-radius:99px;background:#ffffff1a;overflow:hidden}
.ldb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),#a78bfa);box-shadow:0 0 12px var(--c);transition:width .12s linear}
.ldc b{display:block;margin-top:8px;font-size:13px;color:#fff}
@keyframes ldspin{to{transform:rotate(360deg)}}

raw=()=>{if(f.size>lim)return big();const r=new FileReader();r.onload=()=>ok(r.result,f.name);r.onerror=()=>{alert('Berkas gagal dibaca. Data tidak disimpan.');fail&&fail()};r.readAsDataURL(f)};
if(/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size>4e5){const u=URL.createObjectURL(f),im=new Image();
im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas'),x=c.getContext('2d');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.82);if(d.length*.75>lim)return big();ok(d,f.name.replace(/\.[^.]+$/,'')+'.jpg')};
im.onerror=()=>{URL.revokeObjectURL(u);raw()};im.src=u}else raw()}

rn tbl(['','Peran','Nama','NIP / NIS','Email / Username'],T.map(x=>[`<input type="checkbox" style="width:auto" ${AK.off.has(x.id)?'':'checked'} onchange="this.checked?AK.off.delete('${x.id}'):AK.off.add('${x.id}');draw()">`,esc(rolLbl(x)),esc(x.nama),x.kode?esc(x.kode):(x.role=='siswa'?'-':'<span class="tag er">NIP kosong</span>'),`<input style="min-width:130px" value="${esc((AK.ov[x.id]||(EM[x.id]||'').split('@')[0]))}" placeholder="otomatis" onchange="AK.ov['${x.id}']=this.value.trim();draw()"><span class="mu dm">${x.role=='siswa'&&domOf()?'@'+esc(domOf()):''}</span>`]))})()}</div>`+res+akunDl()+akunList()}

const REL=['absen','nilai','kumpul','materi_lihat'];

function siswaDup(){const base=me.role=='guru'?db.siswa.filter(x=>KT().includes(x.kelas)):db.siswa,G={};
base.forEach(x=>{const n=String(x.nis||'').trim().toLowerCase(),k=n?'n:'+n:'m:'+String(x.nama||'').trim().toLowerCase()+'|'+x.kelas;(G[k]=G[k]||[]).push(x)});
const D=Object.values(G).filter(a=>a.length>1);if(!D.length)return alert('Tidak ada siswa duplikat (NIS atau nama dan kelas yang sama).');
const n=D.reduce((t,a)=>t+a.length-1,0);
if(!confirm('Ditemukan '+n+' data siswa duplikat. Satu data per siswa dipertahankan (yang paling banyak datanya), duplikatnya dihapus, dan absensi/nilai/tugas milik duplikat dipindahkan ke data yang dipertahankan. Lanjutkan?'))return;
D.forEach(a=>{a.sort((x,y)=>relN(y.id)-relN(x.id));const keep=a[0];a.slice(1).forEach(d=>{REL.forEach(t=>(db[t]||[]).forEach(x=>{if(x.siswa==d.id)x.siswa=keep.id}));db.siswa=db.siswa.filter(x=>x.id!=d.id)})});
const A=absDupList();if(A.size)db.absen=db.absen.filter(x=>!A.has(x.id));
save();draw();alert(n+' siswa duplikat dihapus.')}

const gwOf=s=>{const e=(db.nilai.find(x=>x.jenis=='gw_siswa'&&x.tahun==TH&&x.siswa==s)||{}).guru;if(e)return e;const st=db.siswa.find(y=>y.id==s);return st?((db.nilai.find(x=>x.jenis=='gw_kelas'&&x.tahun==TH&&x.siswa==st.kelas)||{}).guru||''):''};
/* Siswa binaan = siswa yang ditambahkan satu per satu + semua siswa dari kelas guru wali (otomatis mengikuti kelas). */
const gwFirst=a=>{const m=new Map();a.forEach(x=>{if(!m.has(x.siswa))m.set(x.siswa,x.guru)});return m};
const gwBin=g=>{const ex=gwFirst(db.nilai.filter(x=>x.jenis=='gw_siswa'&&x.tahun==TH)),ck=gwFirst(db.nilai.filter(x=>x.jenis=='gw_kelas'&&x.tahun==TH));return db.siswa.filter(s=>(ex.has(s.id)?ex.get(s.id):ck.get(s.kelas))==g).sort((a,b)=>a.nama.localeCompare(b.nama,'id'))};

function wkRekap(sid){const s=db.siswa.find(x=>x.id==sid)||{},NT=db.nilai.filter(n=>n.siswa==sid&&n.tahun==TH),av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,rows=[];

const MIK=['📘','📖','🧮','🔬','🧪','🧬','🌍','🏛️','✍️','🔤','💻','🎨','🎵','⚽','🕌','⚖️','📊','📐','🧠','🌱','🎬','📝','💡','⭐'];

const MIKRE=/^(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*)\s*/u;
const mSplit=j=>{j=String(j||'');const x=j.match(MIKRE);return x?[x[1],j.slice(x[0].length)]:['',j]};

let MKF='',MI_SEL='',MI_MAN=false;

const mikGet=()=>{const x=(MI_SEL||'').match(MIKRE);return x?x[1]:''};

const tLbl=t=>tNo(t)!=null?'Tugas '+tNo(t):t.judul;
const tBase=()=>db.tugas.filter(t=>me.role=='siswa'?t.kelas==myKelas()&&t.tahun==TH:me.role=='guru'?t.guru==me.id&&t.tahun==TH&&mf(t.mapel):t.tahun==TH&&kgok(t));
const tSort=a=>[...a].sort((x,y)=>String(nm('kelas',x.kelas)).localeCompare(nm('kelas',y.kelas))||String(nm('mapel',x.mapel)).localeCompare(nm('mapel',y.mapel))||((tNo(x)??1e9)-(tNo(y)??1e9))||String(x.due||'').localeCompare(String(y.due||'')));
function tBar(){if(me.role=='siswa')return'';const base=tBase();let ks=[...new Set(base.map(t=>t.kelas))];if(me.role=='guru')ks=[...new Set([...slots().map(s=>s[0].split('|')[0]),...ks])];if(TKF&&!ks.includes(TKF))TKF='';
return ks.length>1?`<div class="mkf np"><button class="b s ${TKF?'g':''}" onclick="tSet('')">Semua kelas (${base.length})</button>${ks.map(k=>`<button class="b s ${TKF==k?'':'g'}" onclick="tSet('${k}')">🏫 ${esc(nm('kelas',k))} (${base.filter(t=>t.kelas==k).length})</button>`).join('')}</div>`:''}

function tadd(){const sl=slots();if(!sl.length)return alert('Belum ada kelas dan mapel. Pilih dulu lewat menu Kelas & Siswa.');
const pre=sl.filter(s=>TKF&&s[0].split('|')[0]==TKF).map(s=>s[0]),one=sl.length==1,sel=pre.length?pre:one?[sl[0][0]]:[];
const nx=()=>{const ks=[...document.querySelectorAll('.tk_s:checked')].map(x=>x.value.split('|'));let mx=0;db.tugas.filter(t=>t.guru==me.id&&t.tahun==TH&&ks.some(p=>p[0]==t.kelas&&p[1]==t.mapel)).forEach(t=>{mx=Math.max(mx,tNo(t)||0)});return mx+1};
md(`<h3>Tugas baru</h3>
<label>Nomor tugas <span class="mu">(otomatis, bisa diubah)</span><input id="tk_n" type="number" min="1" value="1"></label>
<label>Topik / judul tugas <span class="mu">(opsional, mis. Persamaan Linear)</span><input id="tk_j" type="text"></label>
<label>Instruksi<textarea id="tk_d"></textarea></label>
<label>Tenggat<input id="tk_t" type="date"></label>
<label>Berikan ke kelas <span class="mu">(boleh lebih dari satu)</span></label>
<div class="row np" style="margin:0 0 6px"><button type="button" class="b g s" onclick="document.querySelectorAll('.tk_s').forEach(x=>x.checked=true);document.getElementById('tk_n').value=window._tkn()">Pilih semua</button><button type="button" class="b g s" onclick="document.querySelectorAll('.tk_s').forEach(x=>x.checked=false);document.getElementById('tk_n').value=window._tkn()">Kosongkan</button></div>
<div class="mkcl">${sl.map(s=>`<label class="mkc"><input type="checkbox" class="tk_s" value="${esc(s[0])}"${sel.includes(s[0])?' checked':''} onchange="document.getElementById('tk_n').value=window._tkn()"> ${esc(s[1])}</label>`).join('')}</div>
<div class="row"><button class="b" id="tk_ok">Simpan</button><button class="b g" onclick="cm()">Batal</button></div>`);
window._tkn=nx;$('#tk_n').value=nx();
$('#tk_ok').onclick=()=>{const n=parseInt($('#tk_n').value,10),tp=$('#tk_j').value.trim(),due=$('#tk_t').value;if(!(n>0))return alert('Isi nomor tugas (angka 1, 2, 3, ...).');if(!due)return alert('Isi tenggat tugas.');
const ks=[...document.querySelectorAll('.tk_s:checked')].map(x=>x.value);if(!ks.length)return alert('Pilih minimal satu kelas.');
const judul='Tugas '+n+(tp?' - '+tp:''),desc=$('#tk_d').value;
ks.forEach(s=>{const q=s.split('|');db.tugas.push({id:uid(),kelas:q[0],mapel:q[1],judul,desc,due,guru:me.id,tahun:TH})});save();cm();draw()}}

function tgProg(L){const my=db.kumpul.filter(k=>k.siswa==me.id),ok=t=>my.some(k=>k.tugas==t.id),n=L.length,d=L.filter(ok).length,p=n?Math.round(d/n*100):0,mp={};
L.forEach(t=>{(mp[t.mapel]=mp[t.mapel]||[]).push(t)});
return`<div class="tgp"><div class="tgh"><b>Progres Tugas Saya</b><span>${d} dari ${n} tugas selesai · ${p}%</span></div><div class="tgbar"><i style="width:${p}%"></i></div>${Object.entries(mp).map(([m,a])=>{a=tSort(a);const x=a.filter(ok).length;return`<div class="tgm"><div class="tgh" style="margin-bottom:3px"><b style="font-weight:600;color:var(--tx)">${esc(nm('mapel',m))}</b><span>${x}/${a.length} selesai</span></div><div class="tgbar s"><i style="width:${Math.round(x/a.length*100)}%"></i></div><div class="tgchips">${a.map(t=>`<span class="tgchip ${ok(t)?'on':''}" title="${esc(t.judul)} · tenggat ${esc(t.due||'-')}">${tgChk(ok(t))}${esc(tLbl(t))}</span>`).join('')}</div></div>`}).join('')}${n?'':'<p class="mu" style="margin:8px 0 0">Belum ada tugas.</p>'}</div>`}

/* ===== v21: edit materi & tugas (id tetap, pengumpulan dan nilai siswa tetap aman) ===== */
function medit(id){const m=db.materi.find(x=>x.id==id);if(!m||m.guru!=me.id)return;const p=mSplit(m.judul),N=fnames(m);MI_SEL=p[0];MI_MAN=true;
md(`<h3>Edit materi</h3><p class="mu">🏫 ${esc(nm('kelas',m.kelas))} · ${esc(nm('mapel',m.mapel))} · kelas tidak diubah agar data siswa tetap sesuai.</p>
<label>Ikon materi${mikGrid()}</label>
<label>Judul<input id="me_j" type="text" value="${esc(p[1])}"></label>
<label>Isi materi / keterangan<textarea id="me_i">${esc(m.isi||'')}</textarea></label>
<label>Berkas materi ${N.length?`<span class="mu">(saat ini: ${esc(N.join(', '))}. Pilih berkas baru hanya jika ingin menggantinya)</span>`:'<span class="mu">(opsional)</span>'}<input id="me_f" type="file"></label>
<div class="row"><button class="b" id="me_ok">Simpan perubahan</button><button class="b g" onclick="cm()">Batal</button></div>`);
$('#me_ok').onclick=()=>{const j=$('#me_j').value.trim();if(!j)return alert('Isi judul materi.');const ic=mikGet(),f=$('#me_f').files[0],fin=(d,n)=>{m.judul=(ic?ic+' ':'')+j;m.isi=$('#me_i').value;if(n){m.file=n;m.data=d}save();cm();draw()};
if(!f)return fin();badge('Membaca berkas…');rd(f,(d,n)=>fin(d,n))}}

function tedit(id){const t=db.tugas.find(x=>x.id==id);if(!t||t.guru!=me.id)return;const n0=tNo(t),ks=db.kumpul.filter(k=>k.tugas==id),nl=ks.filter(k=>k.nilai!=null).length;
md(`<h3>Edit tugas</h3><p class="mu">🏫 ${esc(nm('kelas',t.kelas))} · ${esc(nm('mapel',t.mapel))} · kelas tidak diubah.</p>
${ks.length?`<p><span class="tag ok">✓ ${ks.length} pengumpulan siswa dan ${nl} nilai tetap tersimpan</span></p>`:''}
<label>Nomor tugas <span class="mu">(kosongkan jika tidak bernomor)</span><input id="te_n" type="number" min="1" value="${n0??''}"></label>
<label>Topik / judul tugas<input id="te_j" type="text" value="${esc(n0!=null?tTopik(t):t.judul)}"></label>
<label>Instruksi<textarea id="te_d">${esc(t.desc||'')}</textarea></label>
<label>Tenggat<input id="te_t" type="date" value="${esc(t.due||'')}"></label>
<div class="row"><button class="b" id="te_ok">Simpan perubahan</button><button class="b g" onclick="cm()">Batal</button></div>`);
$('#te_ok').onclick=()=>{const n=parseInt($('#te_n').value,10),tp=$('#te_j').value.trim(),due=$('#te_t').value;if(!due)return alert('Isi tenggat tugas.');if(!(n>0)&&!tp)return alert('Isi nomor atau judul tugas.');
t.judul=(n>0?'Tugas '+n:'')+(n>0&&tp?' - ':'')+tp;t.desc=$('#te_d').value;t.due=due;save();cm();draw()}}
</script><script>if('serviceWorker'in navigator&&location.protocol.indexOf('http')==0)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})</script>
